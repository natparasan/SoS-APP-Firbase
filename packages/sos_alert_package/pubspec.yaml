name: sos_alert_package
description: A custom Flutter package that provides core Emergency SOS Alert logic - getting current location, formatting alert messages, and triggering SMS/call/share actions to emergency contacts.
version: 0.1.0
homepage: https://example.com

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  geolocator: ^13.0.1
  url_launcher: ^6.3.1
  permission_handler: ^11.3.1
  shared_preferences: ^2.3.3
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
